[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-cot"
authors = [
    {name = "Michal Zawalski", email="m.zawalski@uw.edu.pl"},
    {name = "William Chen", email="verityw@berkeley.edu"},
    {name = "Karl Pertsch", email="pertsch@berkeley.edu"},
]
description = "Embodied Chain-of-Thought Reasoning"
version = "1.0"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["vision-language-actions models", "multimodal pretraining", "robot learning"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=0.25.0",
    "draccus==0.8.0",
    "einops",
    # "flash_attn==2.5.5",      # Here for documentation -- install *AFTER* editable install (follow README)
    "huggingface_hub",
    "json-numpy",
    "jsonlines",
    "matplotlib",
    "peft==0.11.1",
    "protobuf",
    "rich",
    "sentencepiece==0.1.99",
    "timm==0.9.10",
    "tokenizers==0.19.1",
    "torch==2.2.0",
    "torchvision>=0.16.0",
    "torchaudio",
    "transformers==4.40.1",
    "wandb",
    "tensorflow==2.15.0",
    "tensorflow_datasets==4.9.3",
    "tensorflow_graphics==2021.12.3",
    "dlimp @ git+https://github.com/kvablack/dlimp@ad72ce3a9b414db2185bc0b38461d4101a65477a",
    "numpy>=1.26.4",
    "opencv-python",
    "pandas>=2.3.3",
    "whisper>=1.1.10",
    "projectaria-tools>=2.0.0",
    "openai-whisper>=20250625",
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]
sagemaker = [
    "boto3",
    "sagemaker"
]

[project.urls]
homepage = "https://embodied-cot.github.io"
repository = "https://embodied-cot.github.io"
documentation = "https://embodied-cot.github.io"

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "cache",
    "logs*",
    "media*",
    "aria_vrs*",
    "evaluation*",
    "experiments*",
    "checkpoints*",
    "adapter_tmp*",
    "huggingface*",
    "aria_dataset*",
    "training_logs*",
    ".venv*",
    ".tmp*",
    "*.egg-info"
]

[tool.setuptools.package-data]
"prismatic" = ["py.typed"]

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[tool.black]
line-length = 121
target-version = ["py39", "py310", "py311"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py39"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
